version: '3'

tasks:
  restore:
    desc: Восстановить зависимости
    cmds:
      - dotnet restore

  run:training:
    desc: Запуск в учебном режиме
    cmds:
      - dotnet run --project src/Task3.Web -- --App:Mode=Training

  run:production:
    desc: Запуск в боевом режиме
    env:
      APP__MODE: Production
    cmds:
      - dotnet run --project src/Task3.Web

  test:
    desc: Запуск всех тестов
    cmds:
      - dotnet test

  test:training:
    desc: Тесты с учебным режимом через окружение
    env:
      APP__MODE: Training
    cmds:
      - dotnet test

  test:production:
    desc: Тесты с боевым режимом через окружение
    env:
      APP__MODE: Production
    cmds:
      - dotnet test

  web:serve:
    desc: Запуск тестового фронта для CORS (http://localhost:5173)
    cmds:
      - python -m http.server 5173 --directory web

  web:NotAllowed:
    desc: Запуск тестового фронта для CORS (http://localhost:5663) - не разрешенный оригин для CORS
    cmds:
      - python -m http.server 5663 --directory web